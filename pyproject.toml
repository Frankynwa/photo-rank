[project]
name = "photorank"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 允许超长行（已有代码风格）

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300  # pytest-timeout：单测挂死时红牌罚下，不许无限等（本地曾因真模型联网下载卡死）
