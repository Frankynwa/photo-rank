name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio ruff
        # 跳过重量级依赖（pyiqa/mediapipe），测试已 mock
        pip install fastapi uvicorn httpx python-multipart PyYAML python-dotenv
        pip install Pillow pillow-heif opencv-python-headless numpy imagehash

    - name: Run ruff
      run: ruff check .

    - name: Run tests
      run: pytest tests/ -v --tb=short
