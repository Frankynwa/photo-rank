<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoRank — 旅行照片 AI 智能筛选</title>
    <style>
        /* ── CSS Variables / Theme ── */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --bg-card-hover: #1f2a42;
            --bg-input: #151d2e;
            --border-color: #2a3550;
            --border-hover: #3d4f7c;
            --text-primary: #e8ecf4;
            --text-secondary: #8b95a8;
            --text-muted: #5a6478;
            --accent: #6c5ce7;
            --accent-light: #a78bfa;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #a78bfa 100%);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── Header ── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 28px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--accent-gradient);
            opacity: 0.06;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            position: relative;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
        }

        /* ── Container ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ── Upload Zone ── */
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 48px 20px;
            text-align: center;
            background: var(--bg-secondary);
            margin-bottom: 24px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .upload-zone:hover { border-color: var(--accent); }
        .upload-zone:hover::before { opacity: 0.04; }
        .upload-zone.dragover {
            border-color: var(--accent-light);
            background: var(--bg-card);
            transform: scale(1.01);
        }
        .upload-zone.dragover::before { opacity: 0.08; }
        .upload-zone h3 {
            color: var(--accent-light);
            margin-bottom: 8px;
            font-size: 18px;
            position: relative;
        }
        .upload-zone p {
            color: var(--text-muted);
            font-size: 13px;
            position: relative;
        }
        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            position: relative;
            opacity: 0.8;
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: var(--bg-card);
        }

        /* ── Platform Selector ── */
        .platform-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            padding: 6px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        .platform-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }
        .platform-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .platform-btn:hover:not(.active) {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        /* ── Progress ── */
        .progress-container {
            padding: 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            margin-bottom: 24px;
            display: none;
            border: 1px solid var(--border-color);
        }
        .progress-container.show { display: block; }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .progress-header .layer-text {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        .progress-header .layer-detail {
            font-size: 13px;
            color: var(--text-muted);
        }
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: var(--bg-card);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .progress-steps .step { transition: all var(--transition); }
        .progress-steps .step.active { color: var(--accent-light); font-weight: 600; }
        .progress-steps .step.done { color: var(--success); }

        /* ── Status ── */
        .status {
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            display: none;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }
        .status.show { display: block; }
        .status.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }
        .status.error { background: rgba(239, 68, 68, 0.1); color: var(--error); border-color: rgba(239, 68, 68, 0.2); }
        .status.info { background: rgba(59, 130, 246, 0.1); color: var(--info); border-color: rgba(59, 130, 246, 0.2); }

        /* ── Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-secondary);
            padding: 22px 16px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
        }
        .stat-card:hover { border-color: var(--border-hover); }
        .stat-card .value {
            font-size: 34px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Photo Grid ── */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }
        .photo-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            cursor: default;
        }
        .photo-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow);
        }
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform var(--transition);
        }
        .photo-card:hover img { transform: scale(1.03); }
        .photo-card .info { padding: 16px; }
        .photo-card .filename {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .photo-card .score {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .photo-card .score span { font-size: 12px; color: var(--text-muted); }
        .photo-card .score .value {
            font-weight: 700;
            color: var(--accent-light);
        }
        .photo-card .rank {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent-gradient);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .photo-card .analysis {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            line-height: 1.5;
        }
        .photo-card .analysis .tag {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent-light);
            padding: 3px 10px;
            border-radius: 20px;
            margin-right: 4px;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            position: relative;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }
        .modal-content .analysis-detail { margin-top: 24px; }
        .modal-content .analysis-detail h3 {
            color: var(--accent-light);
            margin-bottom: 8px;
            margin-top: 18px;
            font-size: 15px;
        }
        .modal-content .analysis-detail h3:first-child { margin-top: 0; }
        .modal-content .analysis-detail p {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .modal-close:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        /* ── WS Status ── */
        .ws-status {
            position: fixed;
            bottom: 16px;
            right: 16px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: white;
            z-index: 999;
            transition: all var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
        }
        .ws-status.connected { background: rgba(16, 185, 129, 0.85); }
        .ws-status.disconnected { background: rgba(239, 68, 68, 0.85); }
        .ws-status.reconnecting { background: rgba(245, 158, 11, 0.85); color: #1a1a1a; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .header h1 { font-size: 22px; }
            .header p { font-size: 12px; }
            .container { padding: 16px 12px; }
            .upload-zone { padding: 32px 16px; }
            .upload-icon { font-size: 32px; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .photo-card img { height: 140px; }
            .photo-card .info { padding: 12px; }
            .platform-selector { flex-direction: column; gap: 4px; }
            .platform-btn { padding: 10px 14px; }
            .controls { flex-direction: column; }
            .btn { justify-content: center; }
            .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-card { padding: 14px 8px; }
            .stat-card .value { font-size: 24px; }
            .modal-content { padding: 16px; max-width: 95vw; }
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .photo-card { animation: fadeIn 0.35s ease forwards; }
        .photo-card:nth-child(2) { animation-delay: 0.05s; }
        .photo-card:nth-child(3) { animation-delay: 0.1s; }
        .photo-card:nth-child(4) { animation-delay: 0.15s; }
        .photo-card:nth-child(5) { animation-delay: 0.2s; }
        .photo-card:nth-child(6) { animation-delay: 0.25s; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 PhotoRank</h1>
        <p>旅行照片 AI 智能筛选 — 5 层本地模型 + Qwen-VL 深度分析</p>
    </div>

    <div class="container">
        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <span class="upload-icon">📁</span>
            <h3>拖拽照片到这里，或点击上传</h3>
            <p>支持 JPG、PNG、HEIC 格式</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" id="analyzeBtn" disabled>🚀 开始分析</button>
            <button class="btn btn-secondary" id="clearBtn">🗑️ 清空照片</button>
        </div>

        <!-- 平台选择 -->
        <div class="platform-selector">
            <button class="platform-btn active" data-platform="xiaohongshu">📱 小红书</button>
            <button class="platform-btn" data-platform="wechat">💬 朋友圈</button>
            <button class="platform-btn" data-platform="douyin">🎵 抖音</button>
        </div>

        <!-- 进度条 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <span class="layer-text" id="layerText">准备中...</span>
                <span class="layer-detail" id="layerDetail"></span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-steps" id="progressSteps">
                <span class="step" data-layer="1">L1 客观</span>
                <span class="step" data-layer="2">L2 相似</span>
                <span class="step" data-layer="3">L3 审美</span>
                <span class="step" data-layer="4">L4 人脸</span>
                <span class="step" data-layer="5">L5 深度</span>
            </div>
        </div>

        <!-- 状态提示 -->
        <div class="status" id="status"></div>

        <!-- 统计信息 -->
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="value" id="statTotal">0</div>
                <div class="label">总照片数</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statRejected">0</div>
                <div class="label">淘汰数</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statOutput">0</div>
                <div class="label">精选数</div>
            </div>
        </div>

        <!-- 照片网格 -->
        <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="analysis-detail" id="modalAnalysis"></div>
        </div>
    </div>

    <!-- WebSocket 连接状态 -->
    <div class="ws-status disconnected" id="wsStatus">未连接</div>

    <script>
        // 状态
        let currentPlatform = 'xiaohongshu';
        let photos = [];
        let results = [];

        // ── WebSocket（含自动重连） ──
        let ws = null;
        let wsReconnectTimer = null;

        function wsConnect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = function() {
                updateWsStatus('connected');
                if (wsReconnectTimer) {
                    clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = null;
                }
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = function() {
                updateWsStatus('disconnected');
                scheduleReconnect();
            };

            ws.onerror = function() {
                updateWsStatus('disconnected');
                ws.close();
            };
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) return;
            updateWsStatus('reconnecting');
            wsReconnectTimer = setTimeout(function() {
                wsReconnectTimer = null;
                wsConnect();
            }, 3000);
        }

        function updateWsStatus(state) {
            const el = document.getElementById('wsStatus');
            el.className = 'ws-status ' + state;
            const labels = { connected: '已连接', disconnected: '已断开', reconnecting: '重连中...' };
            el.textContent = labels[state] || state;
        }

        // 初始连接
        wsConnect();

        // 上传区域
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            uploadFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            uploadFiles(e.target.files);
        });

        // 上传文件
        async function uploadFiles(files) {
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }

            showStatus('正在上传...', 'info');

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();

                showStatus(`上传完成！共 ${data.total} 张照片`, 'success');
                loadPhotos();
            } catch (error) {
                showStatus('上传失败: ' + error.message, 'error');
            }
        }

        // 加载照片列表
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();
                photos = data.photos;

                document.getElementById('analyzeBtn').disabled = photos.length === 0;
                renderPhotos();
            } catch (error) {
                console.error('加载照片失败:', error);
            }
        }

        // 渲染照片网格
        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="/api/photos/${photo.filename}" alt="${photo.filename}">
                    <div class="info">
                        <div class="filename">${photo.filename}</div>
                        <div class="score">
                            <span>大小</span>
                            <span class="value">${(photo.size / 1024).toFixed(1)} KB</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 开始分析
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            showStatus('正在分析...这可能需要几分钟', 'info');
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch(`/api/analyze?platform=${currentPlatform}`, {
                    method: 'POST',
                });
                const data = await response.json();

                showStatus('分析完成！', 'success');
                loadResults();
            } catch (error) {
                showStatus('分析失败: ' + error.message, 'error');
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        });

        // 加载结果
        async function loadResults() {
            try {
                const response = await fetch(`/api/results/${currentPlatform}`);
                const data = await response.json();
                results = data.results;

                renderResults();
                updateStats();
            } catch (error) {
                console.error('加载结果失败:', error);
            }
        }

        // 渲染结果
        function renderResults() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            results.forEach((result, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.style.position = 'relative';

                const classification = result.category || '';

                card.innerHTML = `
                    <div class="rank">${index + 1}</div>
                    <img src="/api/results/${currentPlatform}/${result.filename}" alt="${result.filename}">
                    <div class="info">
                        <div class="filename">${result.filename}</div>
                        <div class="score">
                            <span>审美分</span>
                            <span class="value">${result.aesthetic_score}</span>
                        </div>
                        <div class="score">
                            <span>综合分</span>
                            <span class="value">${result.final_score}</span>
                        </div>
                        ${classification ? `<div class="analysis"><span class="tag">${classification}</span></div>` : ''}
                    </div>
                `;

                card.addEventListener('click', () => showDetail(result));
                grid.appendChild(card);
            });
        }

        // 更新统计
        function updateStats() {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('statTotal').textContent = photos.length;
            document.getElementById('statRejected').textContent = photos.length - results.length;
            document.getElementById('statOutput').textContent = results.length;
        }

        // 显示详情
        function showDetail(result) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const modalAnalysis = document.getElementById('modalAnalysis');

            modalImage.src = `/api/results/${currentPlatform}/${result.filename}`;

            modalAnalysis.innerHTML = `
                <h3>📊 评分</h3>
                <p>审美分: ${result.aesthetic_score} | 综合分: ${result.final_score}</p>

                <h3>🏷️ 分类</h3>
                <p>${result.category || '未分类'}</p>
            `;

            modal.classList.add('show');
        }

        // 关闭弹窗
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('show');
        });
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) {
                document.getElementById('modal').classList.remove('show');
            }
        });

        // 平台切换
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPlatform = btn.dataset.platform;
                if (results.length > 0) {
                    loadResults();
                }
            });
        });

        // 清空照片
        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (!confirm('确定要清空所有照片吗？')) return;

            for (let photo of photos) {
                await fetch(`/api/photos/${photo.filename}`, { method: 'DELETE' });
            }

            photos = [];
            results = [];
            renderPhotos();
            document.getElementById('stats').style.display = 'none';
            showStatus('已清空所有照片', 'info');
        });

        // 显示状态
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
        }

        // WebSocket 消息处理
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'upload_complete':
                    showStatus(`上传完成！共 ${data.count} 张照片`, 'success');
                    loadPhotos();
                    break;
                case 'analysis_start':
                    showProgress(true);
                    updateProgress(0, '准备分析...', '');
                    break;
                case 'layer_start':
                    handleLayerStart(data);
                    break;
                case 'layer_end':
                case 'layer_complete':
                    handleLayerEnd(data);
                    break;
                case 'layer_progress':
                    handleLayerProgress(data);
                    break;
                case 'analysis_complete':
                    showProgress(false);
                    showStatus('分析完成！', 'success');
                    loadResults();
                    break;
                case 'analysis_error':
                    showProgress(false);
                    showStatus('分析失败: ' + data.error, 'error');
                    break;
            }
        }

        // ── 进度条逻辑 ──
        const LAYER_NAMES = { 0: '准备', 1: '客观指标', 2: '相似聚类', 3: '审美评分', 4: '人脸质量', 5: '深度分析' };

        function showProgress(visible) {
            document.getElementById('progressContainer').classList.toggle('show', visible);
            if (visible) {
                document.querySelectorAll('#progressSteps .step').forEach(s => {
                    s.className = 'step';
                });
            }
        }

        function updateProgress(layer, text, detail) {
            document.getElementById('layerText').textContent = text;
            document.getElementById('layerDetail').textContent = detail || '';
            const pct = Math.min(100, Math.round((layer / 5) * 100));
            document.getElementById('progressBar').style.width = pct + '%';

            document.querySelectorAll('#progressSteps .step').forEach(s => {
                const sl = parseInt(s.dataset.layer);
                if (sl < layer) s.className = 'step done';
                else if (sl === layer) s.className = 'step active';
                else s.className = 'step';
            });
        }

        function handleLayerStart(data) {
            const layer = data.layer || 0;
            const name = data.layer_name || LAYER_NAMES[layer] || '';
            const total = data.total ? ` (${data.total} 张照片)` : '';
            if (layer === 0) {
                updateProgress(0, '开始分析...', `共 ${data.total || '?'} 张照片`);
            } else {
                updateProgress(layer, `Layer ${layer}/5: ${name}中...`, total);
            }
        }

        function handleLayerEnd(data) {
            const layer = data.layer || 0;
            const name = data.layer_name || LAYER_NAMES[layer] || '';
            let detail = '';
            if (data.kept !== undefined) detail = `保留 ${data.kept} 张`;
            else if (data.groups !== undefined) detail = `${data.groups} 组代表`;
            else if (data.scored !== undefined) detail = `已评分 ${data.scored} 张`;
            else if (data.faces !== undefined) detail = `检测到 ${data.faces} 张人脸`;
            else if (data.done !== undefined) detail = `完成 ${data.done} 张分析`;

            updateProgress(layer, `Layer ${layer}/5: ${name} 完成`, detail);
        }

        function handleLayerProgress(data) {
            const layer = data.layer || 5;
            const current = data.current || 0;
            const total = data.total || 1;
            const name = data.layer_name || '深度分析';
            const pct = Math.round(((layer - 1 + current / total) / 5) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('layerText').textContent = `Layer ${layer}/5: ${name} (${current}/${total})`;
            document.getElementById('layerDetail').textContent = data.message || '';
        }

        // 初始化
        loadPhotos();
    </script>
</body>
</html>
